version: 2
updates:
  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Bundle all minor + patch bumps into one PR; majors stay individual
      # so they can be reviewed/tested on their own.
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
