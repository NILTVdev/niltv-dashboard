# Runs on every pull request and on pushes to main (the release branch).
# dev is not re-tested after a merge: it carries the tree the PR already
# checked, and its deploy is a separate workflow.
name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Unit tests for the dashboard's data-shaping logic (GA4/GSC summaries,
      # range filtering) — see lib/analytics.test.ts.
      - name: Test
        run: npm test

      # All data-fetching pages are `force-dynamic`, so the build does not call
      # the API and needs no secrets — it just compiles + type-checks.
      - name: Build
        run: npm run build
